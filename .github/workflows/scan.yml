name: broad-scan

# Broad scan for the FT Stock Picking Game (roadmap item 43; rules in scan/README.md).
# Runs after the US close on weekdays. Two slots cover both sides of the US clock
# change (1 Nov): 20:10 UTC is 16:10 New York until 30 Oct, 21:05 UTC is 16:05
# New York from 2 Nov. The script skips a session it has already scanned.
# A push that changes scan/request.txt forces a run (the evening review uses this
# when the scheduled run is late).
on:
  schedule:
    - cron: "10 20 * * 1-5"
    - cron: "5 21 * * 1-5"
  push:
    branches: [main]
    paths: ["scan/request.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: broad-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scan/requirements.txt
      - name: Install
        run: pip install -q -r scan/requirements.txt
      - name: Scan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python scan/scan.py; else SCAN_DEBUG="$(grep -c debug scan/request.txt)" python scan/scan.py --force; fi
      - name: Commit results
        if: always()
        shell: bash
        run: |
          git config user.name "ft-game scan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f scan/log.txt.part ]; then mv scan/log.txt.part scan/log.txt; echo "(run stopped before the end)" >> scan/log.txt; fi
          git add scan
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          session=$(python -c "import json;print(json.load(open('scan/latest.json')).get('session_us','?'))" 2>/dev/null || echo "?")
          git commit -q -m "Broad scan: US session ${session} (${{ github.event_name }})"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
