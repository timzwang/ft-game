name: price-feed

# Price and macro feed for the FT Stock Picking Game (roadmap item 59, playbook 6.12, 21 Oct 2026; feed/README.md).
# Claude's scheduled runs read feed/latest.json (evening and weekly reviews) and feed/live.json (price refreshes)
# with git, in place of fetching one price page per stock.
#
# Close mode, after the US close on weekdays: 20:16 UTC is 16:16 New York until 30 Oct, 21:16 UTC from 2 Nov (US
# clocks go back on 1 Nov). A bar counts as final from 16:15 New York; a slot that finds the session already written
# does nothing. GitHub often starts scheduled jobs 20 to 40 minutes late (the scan's 20:20 slot ran at 20:52 UTC on
# 20 Oct), so the runs do not wait for it: they ask for a run by pushing a line, which starts one at once.
# On request: a push to main that changes feed/request.txt or scan/request.txt. A commit whose message starts
# "Feed request: live" runs live mode (the price refreshes); any other runs close mode, forced (the evening review's
# "Scan request" commit therefore refreshes the feed as well as the scan). A line "tickers: A B C" among the last 20
# lines of feed/request.txt adds those tickers.
on:
  schedule:
    - cron: "16 20 * * 1-5"
    - cron: "16 21 * * 1-5"
  push:
    branches: [main]
    paths: ["feed/request.txt", "scan/request.txt"]
  workflow_dispatch:
    inputs:
      mode:
        description: "close (after the US close) or live (during the session)"
        type: choice
        options: [close, live]
        default: close

permissions:
  contents: write

concurrency:
  group: price-feed
  cancel-in-progress: false

jobs:
  feed:
    # Only ever from main, like the scan: a run started on another branch would push that branch's commits to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scan/requirements.txt
      - name: Install
        run: pip install -q -r scan/requirements.txt
      - name: Feed
        shell: bash
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          mode=close; force="--force"
          case "${{ github.event_name }}" in
            schedule) force="" ;;
            workflow_dispatch) mode="${{ inputs.mode }}" ;;
            push) case "$HEAD_MSG" in "Feed request: live"*) mode=live ;; esac ;;
          esac
          echo "MODE=$mode" >> "$GITHUB_ENV"
          if [ "$mode" = "live" ]; then python feed/feed.py live; else python feed/feed.py close $force; fi
      - name: Commit results
        if: always()
        shell: bash
        run: |
          git config user.name "ft-game feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          if [ "${MODE:-close}" = "live" ]; then
            what=$(python -c "import json;m=json.load(open('feed/live.json'))['meta'];print('live', m['read_uk'], 'UK,', m['quotes'], 'quotes')" 2>/dev/null || echo "live")
          else
            what=$(python -c "import json;m=json.load(open('feed/latest.json'))['meta'];print('US session', m['session_us'])" 2>/dev/null || echo "close")
          fi
          git commit -q -m "Price feed: ${what} (${{ github.event_name }})"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
